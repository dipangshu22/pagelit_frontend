<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PAGELIT</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <h1>PAGELIT</h1>
    <p class="subtitle">Smart Image Tools</p>

    <!-- Upload Area -->
    <label for="fileInput" class="upload-box" id="uploadBox">
        <div class="upload-content">
            <div class="upload-icon">📂</div>
            <span>Tap or Drag Images</span>
            <small>Supports multiple files</small>
        </div>
    </label>

    <input type="file" id="fileInput" multiple hidden>

    <!-- Output -->
    <div id="output"></div>
    <div id="downloadSection"></div>

</div>

<!-- Bottom Navigation -->
<div class="bottom-nav">
    <button onclick="convertToPDF()">
        <span>📄</span>
        <small>PDF</small>
    </button>
    <button onclick="imageToText()">
        <span>📝</span>
        <small>Text</small>
    </button>
    <button onclick="removeBackground()">
        <span>🎨</span>
        <small>Remove BG</small>
    </button>
</div>

<script src="script.js"></script>
</body>
</html>
