<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PAGELIT</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <h1>PAGELIT</h1>
    <p class="subtitle">Convert Images to PDF & Extract Text Instantly</p>

    <div class="note">
        <h4>Note:</h4>
        <p>Import clear images to extract text with accuracy</p>
    </div>

    <div class="card">

        <label for="fileInput" class="upload-box">
            <div class="upload-content">
                <span>📂 Drag & Drop or Click to Upload</span>
                <small>Supports multiple images</small>
            </div>
        </label>

        <input type="file" id="fileInput" multiple hidden>

        <div class="buttons">
            <button class="primary" onclick="convertToPDF()">Convert to PDF</button>
            <button class="secondary" onclick="imageToText()">Extract Text</button>
            <button class="secondary" onclick="removeBackground()">Remove Background</button>
        </div>

        <div id="output"></div>
        <div id="downloadSection"></div>

    </div>
</div>

<script src="script.js"></script>
</body>
</html>
